# Chọn loại CSDL kích hoạt mặc định: h2 | sqlite | mysql | postgresql | sqlserver
db.active=h2

# 1. H2 Database (Embedded - Khởi động ngay không cần cài đặt SQL Server)
db.h2.database=qlsv_h2
db.h2.username=sa
db.h2.password=

# 2. SQLite Database (Embedded - File cơ sở dữ liệu qlsv_db.db)
db.sqlite.database=qlsv_db

# 3. PostgreSQL / Supabase Cloud Database (Khuyến nghị demo qua Internet)
db.postgresql.host=aws-0-ap-southeast-1.pooler.supabase.com
db.postgresql.port=5432
db.postgresql.database=postgres
db.postgresql.username=postgres.your-project-id
db.postgresql.password=your-password

# 4. MySQL Server (Localhost / XAMPP / Docker)
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=qlsv_ptit
db.mysql.username=root
db.mysql.password=root123

# 5. Microsoft SQL Server
db.sqlserver.host=localhost
db.sqlserver.port=1433
db.sqlserver.database=QLSV
db.sqlserver.username=sa
db.sqlserver.password=YourStrongPassword123
